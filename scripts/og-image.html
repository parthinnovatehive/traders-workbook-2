<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0a0d14;
        color: #e7ecf5;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px 64px;
      }
      /* Soft brand-tinted glow, kept subtle so text contrast stays high. */
      .glow {
        position: absolute; inset: 0;
        background:
          radial-gradient(900px 480px at 82% 8%, rgba(59,130,246,0.16), transparent 60%),
          radial-gradient(760px 420px at 6% 96%, rgba(31,179,126,0.14), transparent 62%);
        pointer-events: none;
      }
      .row { display: flex; align-items: center; gap: 22px; position: relative; }
      .wordmark { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
      .tag {
        font-size: 17px; font-weight: 500; color: #8b94a6;
        border: 1px solid #232b3a; border-radius: 999px; padding: 7px 18px;
      }
      .accent { width: 76px; height: 6px; border-radius: 3px; background: #1fb37e; }
      h1 {
        position: relative;
        font-size: 74px; line-height: 1.06; font-weight: 700; letter-spacing: -0.035em;
        max-width: 940px;
      }
      .sub {
        position: relative;
        margin-top: 26px;
        font-size: 27px; line-height: 1.45; color: #aeb7c7; font-weight: 400; max-width: 880px;
      }
      .foot {
        position: relative;
        display: flex; align-items: flex-end; justify-content: space-between; gap: 40px;
      }
      .features { display: flex; gap: 34px; font-size: 20px; color: #8b94a6; }
      .features span { display: flex; align-items: center; gap: 10px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #3b82f6; }
      .domain { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 20px; color: #8b94a6; }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <div class="row">
      <!-- The favicon mark, inlined so the image has no external dependency. -->
      <svg width="58" height="58" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#10151f" />
        <line x1="11" y1="6" x2="11" y2="26" stroke="#1fb37e" stroke-width="2" />
        <rect x="8" y="11" width="6" height="9" rx="1" fill="#1fb37e" />
        <line x1="21" y1="8" x2="21" y2="24" stroke="#f0524a" stroke-width="2" />
        <rect x="18" y="13" width="6" height="8" rx="1" fill="#f0524a" />
      </svg>
      <div class="wordmark">Trader&rsquo;s Workbook</div>
    </div>

    <div>
      <h1>Trading Journal &amp;<br />Performance Analytics</h1>
      <p class="sub">
        Record every trade, then let one tested calculation engine show you
        expectancy, R&#8209;multiples, drawdown and risk.
      </p>
    </div>

    <div class="foot">
      <div class="features">
        <span><i class="dot"></i>Forex</span>
        <span><i class="dot"></i>Indian F&amp;O &amp; Equity</span>
        <span><i class="dot"></i>Strategy &amp; Psychology</span>
      </div>
      <div class="domain">tradersworkbook.com</div>
    </div>
  </body>
</html>
